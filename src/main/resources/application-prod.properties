# Activated in production via SPRING_PROFILES_ACTIVE=prod.
# Connects to a real Postgres instance instead of the local H2 file,
# since most deploy hosts don't guarantee a persistent local filesystem.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
